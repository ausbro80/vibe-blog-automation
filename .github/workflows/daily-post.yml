name: Vibe Coding Blog 자동 포스팅 (하루 2회)
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (테스트용)"
        required: false
        default: "false"
        type: boolean
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  post-blog:
    name: 블로그 글 생성 및 포스팅
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 한글 폰트 + ffmpeg 설치
        run: |
          sudo apt-get update --fix-missing || true
          sudo apt-get install -y --fix-missing fonts-noto-cjk ffmpeg || true
      - name: 블로그 자동화 실행
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID:          ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CREDENTIALS_JSON:  ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          INSTAGRAM_ACCESS_TOKEN:   ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:     ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME:    ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:       ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:    ${{ secrets.CLOUDINARY_API_SECRET }}
          THREADS_ACCESS_TOKEN:     ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_ACCOUNT_ID:       ${{ secrets.THREADS_ACCOUNT_ID }}
          GOOGLE_TTS_API_KEY:       ${{ secrets.GOOGLE_TTS_API_KEY }}
          DRY_RUN:                  ${{ inputs.dry_run || 'false' }}
        run: python src/main.py
      - name: 중복 방지 히스토리 저장
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          # 1) 변경 파일을 먼저 stage (rebase 전에 unstaged 상태가 없도록)
          [ -f src/posted_history.json ] && git add src/posted_history.json || true
          # 2) stage된 변경이 있을 때만 commit → rebase → push
          if ! git diff --staged --quiet; then
            git commit -m "chore: update posted_history [skip ci]"
            git pull --rebase origin main || true
            git push || true
          else
            echo "변경 없음 — skip"
          fi
      - name: 저장소 활성 유지
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          # 잔여 unstaged 변경이 있다면 정리 (rebase 충돌 방지)
          git stash --include-untracked || true
          git pull --rebase origin main || true
          git stash drop || true
          git commit --allow-empty -m "keep alive $(date '+%Y-%m-%d %H:%M')"
          git push || true
